services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./client/.env
    depends_on:
      - server
    networks:
      - pem_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://localhost:${SERVER_PORT:-5000}/api/ready`).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/expense_manager?replicaSet=rs0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PORT=${SERVER_PORT:-5000}
    networks:
      - pem_net

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/expense_manager?replicaSet=rs0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PORT=${WORKER_PORT:-5001}
    networks:
      - pem_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - pem_net

  mongo:
    image: mongo:6
    command: ["mongod", "--bind_ip_all", "--port", "27017", "--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pem_net

volumes:
  mongo-data:
  redis-data:
  export-data:
  client-node-modules:
  server-node-modules:

networks:
  pem_net:
    name: personal_expense_management_net
    driver: bridge
