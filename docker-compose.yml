services:
  mongo:
    image: mongo:7
    command:
      - --bind_ip_all
      - --port
      - "27017"
      - --replSet
      - rs0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - pem_net

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/bash
      - -lc
      - |
        until mongosh --host mongo --port 27017 --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do
          sleep 2;
        done;

        for i in $(seq 1 30); do
          if mongosh --host mongo --port 27017 --quiet --eval '
            try {
              const status = rs.status();
              if (status && status.ok === 1) {
                quit(0);
              }
            } catch (err) {
              const msg = String(err?.message ?? err ?? "");
              if (msg.includes("no replset config has been received") || msg.includes("not running with --replSet")) {
                quit(0);
              }
              throw err;
            }
            quit(0);
          ' >/dev/null 2>&1; then
            break;
          fi
          sleep 2;
        done;

        mongosh --host mongo --port 27017 --quiet --eval '
          try {
            const status = rs.status();
            if (status && status.ok === 1) {
              print("Replica set already initialized");
              quit(0);
            }
          } catch (err) {
            const msg = String(err?.message ?? err ?? "");
            if (!msg.includes("no replset config has been received") && !msg.includes("not running with --replSet")) {
              throw err;
            }
          }

          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongo:27017" }]
          });
        '
    networks:
      - pem_net

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "900"
      - "1000"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - pem_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/expense_manager?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - pem_net

  worker-export:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    working_dir: /app
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    env_file:
      - ./server/.env
    environment:
      PORT: "5001"
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/expense_manager?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      ENABLE_EXPORT_WORKER: "true"
      WORKER_MODE: worker
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pem_net

  worker-snapshot:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker:snapshot"]
    working_dir: /app
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/expense_manager?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pem_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:5000
    env_file:
      - ./client/.env
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    networks:
      - pem_net

volumes:
  mongo-data:
  redis-data:
  export-data:
  client-node-modules:
  server-node-modules:

networks:
  pem_net:
    name: personal_expense_management_net
    driver: bridge
