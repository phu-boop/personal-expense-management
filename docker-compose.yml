services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./client/.env
    depends_on:
      - server
    networks:
      - pem_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    environment:
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - MONGO_URI=mongodb://mongo:27017/expense_manager?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    networks:
      - pem_net

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - export-data:/app/exports
    environment:
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      - MONGO_URI=mongodb://mongo:27017/expense_manager?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - PORT=5001
    networks:
      - pem_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - pem_net

  mongo:
    image: mongo:6
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pem_net

  mongo-init:
    image: mongo:6
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "until mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do echo 'waiting for mongo...'; sleep 2; done; mongosh --host mongo:27017 --quiet --eval \"try { if (rs.status().ok) { print('replica set already initialized'); } } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); }\""

volumes:
  mongo-data:
  redis-data:
  export-data:
  client-node-modules:
  server-node-modules:

networks:
  pem_net:
    name: personal_expense_management_net
    driver: bridge
